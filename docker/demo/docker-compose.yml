version: '3.8'

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    command: start-dev --import-realm
    networks:
      - test-network
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded

      KC_HOSTNAME: https://localhost:9000/oidc
      KC_HOSTNAME_STRICT: false
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  setup-users:
    image: curlimages/curl:latest
    container_name: setup-users
    networks:
      - test-network
    depends_on:
      - keycloak
    env_file:
      - .env
    entrypoint: [ "sh", "-c", "/app/init-users.sh" ]
    volumes:
      - ../keycloak/init-users.sh:/app/init-users.sh:ro
    working_dir: /app

  db:
    image: postgres:18.3-alpine
    container_name: db
    networks:
      - test-network
    environment:
      POSTGRES_USER: ${DATABASE_ADMIN_USER}
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - ./resources/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  init-db:
    image: postgres:18.3-alpine
    container_name: init-db
    networks:
      - test-network
    depends_on:
      - db
    environment:
      PGPASSWORD: ${DATABASE_ADMIN_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        echo "Waiting for schema..."
        
        until psql \
          -h "db" \
          -p "$DATABASE_PORT" \
          -U "$DATABASE_ADMIN_USER" \
          -d "$DATABASE_NAME" \
          -tAc "SELECT 1 FROM information_schema.tables WHERE table_name = 'deployments'" \
        | grep -q 1
        do
          echo "Tables not ready yet..."
          sleep 2
        done
        
        echo "Schema ready"
        psql \
          -h "db" \
          -p "$DATABASE_PORT" \
          -U "$DATABASE_ADMIN_USER" \
          -d "$DATABASE_NAME" \
          -f /scripts/init_data.sql
    volumes:
      - ./resources/init_data.sql:/scripts/init_data.sql:ro

  api:
    build:
      context: ../../api
    container_name: api
    networks:
      - test-network
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_ADMIN_USER: ${DATABASE_ADMIN_USER}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SUPER_ADMIN_EXTERNAL_ID: ${SUPER_ADMIN_EXTERNAL_ID}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED}
      LOGGING_LEVEL: ${LOGGING_LEVEL}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI}
      SSL_KEY_STORE: ${SSL_KEY_STORE}
      SSL_KEY_STORE_PASSWORD: ${SSL_KEY_STORE_PASSWORD}
      SSL_KEY_PASSWORD: ${SSL_KEY_PASSWORD}
    depends_on:
      - db


  ui:
    build:
      context: ../../ui
    container_name: ui
    networks:
      - test-network
    ports:
      - 9000:443
    volumes:
      - ./resources/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./resources/selfsigned.crt:/etc/nginx/certs/selfsigned.crt:ro
      - ./resources/selfsigned.key:/etc/nginx/certs/selfsigned.key:ro
      - ./resources/oidc.json:/usr/share/nginx/html/config/oidc.json:ro
    depends_on:
      - api

  version-checker:
    build:
      context: ../version-checker
    container_name: version-checker
    networks:
      - test-network
    environment:
      USERNAME: ${VERSION_CHECKER_USERNAME}
      PASSWORD: ${VERSION_CHECKER_PASSWORD}
      CLIENT_ID: ${VERSION_CHECKER_CLIENT_ID}
      CLIENT_SECRET: ${VERSION_CHECKER_CLIENT_SECRET}
      TOKEN_URL: ${VERSION_CHECKER_TOKEN_URL}
      API_URL: ${VERSION_CHECKER_API_URL}
      DEFAULT_TEAM: ${VERSION_CHECKER_DEFAULT_TEAM}
      DEFAULT_ENVIRONMENT: ${VERSION_CHECKER_DEFAULT_ENVIRONMENT}
      DEFAULT_CLIENT: ${VERSION_CHECKER_DEFAULT_CLIENT}
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  test-network:
    name: test-network
    driver: bridge
